[Distribution]
Distribution=arch

[Output]
Format=portable
ImageId=prosody
CompressOutput=yes

[Content]
Bootable=no
Packages=prosody
         lua54-dbi
         unbound
         ca-certificates
BuildPackages=luarocks
              lua54-luarocks
              gcc
              gzip
ExtraTrees=extra-modules/files:/usr/lib/prosody/extra-modules
RemoveFiles=/etc/prosody/*
            /usr/share/prosody/tools
            /etc/systemd
            /usr/lib/sysusers.d
            /usr/lib/tmpfiles.d
            /usr/lib/udev
            /usr/lib/sysctl.d
            /etc/pacman.d
            /usr/share/libalpm
            /etc/*tab
            /etc/locale.gen
            /etc/passwd-
            /etc/shadow-
            /etc/group-
            /etc/gshadow-
            /etc/subuid
            /etc/subgid
            /etc/.pwd.lock
            /etc/logrotate.d
            /etc/skel
            /usr/share/factory
            /usr/share/man
            /usr/share/info
            /usr/share/doc
            /usr/share/gtk-doc
            /usr/src
            /usr/include
            /usr/lib/pkgconfig
            /usr/share/aclocal
            /usr/lib/cmake
            /usr/share/readline
            /usr/share/bash-completion
            /usr/share/zsh
            /usr/share/pixmaps
            /usr/lib/clock-epoch
            /usr/local
            /srv
            /boot
            /efi
CleanPackageMetadata=yes

[Build]
Environment=PORTABLE_PREFIXES=%i
Environment=LUA_VERSION=5.4
ToolsTree=yes
ToolsTreeProfiles=misc
ToolsTreePackages=patch devtools
WithNetwork=yes

[Validation]
Verity=signed
VerityKey=mkosi.key
VerityCertificate=mkosi.crt
